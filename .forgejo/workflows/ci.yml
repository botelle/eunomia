name: CI

# Runs on every push EXCEPT a plans-only one, so a branch is tested before a PR
# exists — the cheap deterministic gate goes first, and an expensive review is
# never spent on code that does not pass. This is roadmap row 8's ordering, at
# the repo level. It also keeps `main` covered after a merge, which a
# pull_request-only trigger does not.
#
# "Except" is doing real work in that sentence and there are two cases where the
# forge decides it, not this file — see FIRST PUSH below. Both were found by
# review 2147 after the ignore list landed.
# push ONLY. Forgejo publishes no merge ref (only refs/pull/N/head), so a
# `pull_request` run builds the same tree the `push` run already built — the
# two statuses on 755a5b9 carry one head_sha. It bought nothing and cost a
# duplicate. Proving the MERGE is a separate job: see ADR-0002 and
# bin/fleet-candidate.
# `paths-ignore`, not a per-job condition: a plans-only push skips this workflow
# entirely and `Plans` (.forgejo/workflows/plans.yml) covers it in milliseconds
# instead of four minutes. A mixed push — any file outside plans/ — still runs the
# whole suite, because `paths-ignore` skips only when EVERY changed path matches.
#
# `docs/**` IS NOT IGNORED, and the reason is the rule for anything added here:
# an ignored path must be one the SUITE does not read. It reads two docs and
# EXECUTES them — tests/test_fleet_cr.py runs every fenced block in
# docs/launch-preamble.md, tests/test_fleet_heartbeat.py runs docs/takeover.md —
# so a docs-only push with a broken command would skip the suite, take a green
# from Plans, merge, skip the suite again on main (that push is docs-only too),
# and surface as a red main under the next unrelated author. `plans/**` is
# ignorable only because plans.yml runs the SAME `fleet-plan lint` that the
# suite's test_repo_plans_are_valid runs — the check moves lanes, it does not
# disappear. test_nothing_the_suite_reads_is_ignored_by_ci enforces this.
#
# THE PUSH DIFF IS NOT THE CHANGE — three cases. (a) and (b) were VERIFIED
# against Forgejo 15's implementation by review 2147; (c) was measured on #211.
# None of this is a suspicion and it must not be softened back into one.
#
# (a) PLANS-TIPPED FIRST PUSH. `GetFilesChangedBetween` runs
#     `git diff-tree --root -r <head>` alone when `before` is the zero SHA, so a
#     new branch's first push is filtered on its TIP COMMIT only. A branch whose
#     last commit touches only plans/ therefore skips this workflow and carries a
#     real `Plans` green over untested code. That is not a corner case here: plans
#     0004 and 0010 require the implementer's PR to flip the plan's `status:` to
#     `done`, and the natural commit order is code first, status flip last, one
#     push. The consumer of that green is the review dispatcher, which is
#     automated and cannot read this comment. MITIGATED in plans.yml — see (c)
#     for what that gate now asks.
#
# (b) MERGE-COMMIT-TIPPED FIRST PUSH. `git diff-tree` prints nothing for a merge
#     commit without `-m`, so the changed-file list is EMPTY. An empty list means
#     this workflow's `paths-ignore` matches everything and skips, and plans.yml's
#     `paths` matches nothing and also skips: the head gets NO status at all.
#     Three of roughly sixty merged branches in this repo have a merge-commit tip,
#     and `git merge main` before a first push is routine conflict resolution.
#     NOT mitigated here, deliberately: a missing status is the safe direction —
#     `dispatch-review.py:ci_verdict` treats it as a warning to investigate, not
#     as a pass — whereas (a) produces a green that is affirmatively wrong.
#
# (c) FORCE PUSH. `before` is a real SHA that is NOT an ancestor of `after`, so
#     `GetFilesChangedBetween` returns the rebase delta rather than the change.
#     An earlier version of this comment claimed the opposite — "every later
#     push to the branch has a real `before` SHA and ci.yml decides correctly" —
#     and #211 falsified it on 2026-09-08. That PR changes one file,
#     tests/test_launchd_units.py. It was rebased onto a main whose only
#     movement was in plans/, so the push diff was plans-only, this workflow's
#     `paths-ignore` skipped the whole suite, and the head carried exactly one
#     status: a real `Plans / lint` green, blind to the only file the PR
#     touches. The dispatcher read it as clean and was about to spend a review
#     round on a commit that had never been built.
#
#     Rebasing before opening a PR is routine, and the fleet's own house rule
#     ("branch from main, PR against main") produces it, so this is the common
#     case of the three, not the exotic one.
#
#     MITIGATED in plans.yml, which no longer asks HOW the push arrived. Asking
#     that means enumerating (a), (b) and (c) correctly and forever; the gate
#     now asks what `merge-base..HEAD` contains, which is the same range the
#     reviewer and the PR see and is unaffected by the push shape. That
#     subsumes (a) as well.
#
# The durable fix for all three is in dispatch-review.py: require the `CI /
# tests` context whenever `base..head` leaves plans/, so a green from a workflow
# that read none of the changed files is not read as a pass. That is a talos
# change and outside this repo's lease; it shipped as operator/talos#37. The two
# halves are independent on purpose — this file makes the suite RUN, talos makes
# its absence VISIBLE — and neither is sufficient alone.
#
# Measured 2026-09-07: 15 runs between 12:00 and 13:34, median 258 s between
# starts, one lane wide (see the concurrency note below). Most of that queue was
# markdown running a 433-test suite, and a plan PR waited 15 minutes for a runner
# without its own job ever starting.
#
# NOT ignored: `SPEC.md` and every other top-level file. SPEC declares the closed
# event-type set that `bin/fleet-emit` and `bin/fleet-events` duplicate, the suite
# is what compares them, and a `**.md` ignore would take that comparison out on a
# SPEC-only change — which is exactly the shape of the drift PR #84 had to fix.
on:
  push:
    paths-ignore:
      - 'plans/**'
    # A test lane's result lands under this namespace, opened as a draft PR
    # by bin/fleet-lane (plan 0070) — untested vendor-authored files, and
    # ci.yml's `tests` job runs pytest on every push it does not ignore. A
    # test file landed under tests/ would execute on this self-hosted runner
    # the moment the wrapper pushed it, before any human had read it. The
    # `agent/tests/<plan>/<runner>` shape (never a bare `agent/…`) is what
    # makes this ignore specific to the lane's own branches.
    branches-ignore:
      - 'agent/tests/**'

# Both triggers fire for a branch that has a PR open, so the same commit is
# tested twice — deliberate above, and harmless on a hosted runner. On the
# self-hosted `cihost` runner it is a race: two jobs check out and build a
# .venv in the same place, and they corrupt each other.
#
# Observed 2026-09-02 on f15b67d5, which produced two statuses for one commit —
# `CI / tests (pull_request)` succeeded and `CI / tests (push)` failed, with
# identical code. The push run was then read as a red build and correctly
# refused a review round, so a scheduling artifact blocked real work.
#
# A QUEUE, not a canceller, and scoped to the whole workflow.
#
# Two corrections are baked into that line, both learned the expensive way.
#
# 1. An earlier version keyed on `github.ref` and grouped NOTHING: the two
#    triggers do not share a ref for one commit (on 755a5b9 the push run
#    reports head_branch `feat/fleet-reviews`, the pull_request run `#24`).
#    `github.head_ref || github.ref`, the widely copied form, fails identically.
#
# 2. Keying on the commit then grouped them correctly — and made things WORSE,
#    because `cancel-in-progress: true` killed one of the pair, and a cancelled
#    run reports as `failure` on the commit status (measured on 0a46e6f). The
#    review dispatcher refuses a red build, so a scheduling artifact blocked
#    real work again, by a new route. Never cancel a run whose status something
#    else consumes as a verdict.
#
# Workflow-scoped because the remaining collision is between DIFFERENT commits:
# this runner's workspace is per-repository, so two eunomia jobs at once share a
# checkout and a .venv. Run 21 is the proof — it failed on a tree
# BYTE-IDENTICAL to one that had already passed twice (4347177 and ea57062 both
# have tree 19c4bb0b), so nothing in its code can explain it. The fleet's own
# precedent is an explicit flock for exactly this ("one at a time on cihost,
# fleet-wide", infra/cihost/testflight-build.sh:27); this is that flock,
# expressed where the jobs are scheduled.
# A LITERAL key, not `${{ github.workflow }}`, so that `Plans` shares this lane.
# The hazard the group exists for is the runner's per-repository workspace, which
# does not care which workflow is checking out into it — two workflows for this
# repo at once collide exactly as two runs of one workflow do. Keying on the
# workflow name would have made `Plans` a second, parallel lane and reintroduced
# run 21 by a new route. Same value in both files, deliberately.
concurrency:
  group: eunomia-cihost-workspace
  cancel-in-progress: false

jobs:
  # Both labels run `tests` — not just `cihost-linux` once it exists — because
  # the point of plan 0024 Track A is a *comparison*: docs/fleet-history.md
  # needs both columns (checkout, install, test, total) for the same commit,
  # and a table with one column filled in proves nothing. `fail-fast: false`
  # because the two labels are being measured, not raced against each other —
  # a flaky or slow run on one must not cancel the other's data.
  #
  # The job is named with the label so the two resulting commit statuses are
  # distinct (`CI / tests (cihost)` and `CI / tests (cihost-linux)`) rather
  # than two runs of one ambiguous status.
  tests:
    strategy:
      fail-fast: false
      matrix:
        label: [cihost, cihost-linux]
    name: tests (${{ matrix.label }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    # This is NOT covering for the test suite: every test file that commits
    # (test_fleet_candidate.py, test_fleetlib_workspace.py,
    # test_orchestrator.py, test_installers.py) sets identity per-command
    # with `git -c user.name=… -c user.email=…`, deliberately — a global
    # GIT_AUTHOR_* would outlive one test module and leak into whatever runs
    # next under pytest-randomly's shuffled order (test_fleet_candidate.py's
    # `_git` comment). What this env block actually replaces is what the
    # host normally supplies from the operator's own ~/.gitconfig for git
    # operations OUTSIDE the tests: `bin/fleet-candidate`'s `_git` wrapper
    # runs `git merge --no-ff --no-commit` with no `-c` identity of its own,
    # so it depends on ambient config the cihost-linux image has none of
    # (first real run, commit 6f89870, failed with "Committer identity
    # unknown"). That ambient dependency lives in production code under
    # bin/, not in the tests, and belongs to a follow-up there — a workflow
    # change must not edit bin/ either.
    env:
      GIT_AUTHOR_NAME: forgejo-runner
      GIT_AUTHOR_EMAIL: runner@cihost.example
      GIT_COMMITTER_NAME: forgejo-runner
      GIT_COMMITTER_EMAIL: runner@cihost.example
      # CI_LABEL: the matrix expression itself, resolved once per job into a
      # plain env var, so plans.yml's verbatim-pinned copy of these run:
      # bodies (test_the_first_push_suite_matches_ci) does not need a matrix
      # it does not have — it sets this one var instead.
      CI_LABEL: ${{ matrix.label }}
    steps:
      # L3: the stamp lives under $RUNNER_TEMP (or, when that is unset, a
      # path keyed by $GITHUB_RUN_ID) — never a bare file in the workspace.
      # The `cihost` label's workspace is a per-repo checkout that persists
      # between runs; a `.ci-timing-start` left over from a run whose
      # checkout step failed early would hand a later run a bogus, too-low
      # total computed against the wrong start. $RUNNER_TEMP and the run-id
      # fallback are both per-job, so a previous run's file can't be read by
      # this one. Written BEFORE checkout so the checkout step's own cost is
      # inside the measured window (plan 0024 §2's four timing columns).
      - name: stamp
        shell: bash
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            stamp_file="$RUNNER_TEMP/ci-timing-start-$CI_LABEL"
          else
            stamp_file="/tmp/ci-timing-start-${GITHUB_RUN_ID:-unknown}-$CI_LABEL"
          fi
          date +%s > "$stamp_file"

      - uses: actions/checkout@v4

      - name: checkout
        shell: bash
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            stamp_file="$RUNNER_TEMP/ci-timing-start-$CI_LABEL"
          else
            stamp_file="/tmp/ci-timing-start-${GITHUB_RUN_ID:-unknown}-$CI_LABEL"
          fi
          job_start=$(cat "$stamp_file" 2>/dev/null || echo "")
          if [ -n "$job_start" ]; then
            now=$(date +%s)
            echo "TIMING label=$CI_LABEL step=checkout seconds=$((now - job_start))"
          else
            echo "TIMING label=$CI_LABEL step=checkout seconds=unknown"
          fi

      - name: install
        shell: bash
        run: |
          start=$(date +%s)
          python3 -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          # pytest-randomly is deliberate: this suite's env-leak class of bug
          # (a var read at import, not cleared between loads) is invisible in
          # a fixed order and was found twice by random ordering.
          .venv/bin/python -m pip install -q pytest pytest-randomly
          end=$(date +%s)
          echo "TIMING label=$CI_LABEL step=install seconds=$((end - start))"

      - name: tests
        shell: bash
        run: |
          start=$(date +%s)
          # -rs: a skip's reason goes to the job log, not only a count — the
          # root-user chmod-lease skip is otherwise invisible next to a bare
          # "1 skipped".
          .venv/bin/python -m pytest -q -rs
          end=$(date +%s)
          echo "TIMING label=$CI_LABEL step=tests seconds=$((end - start))"

      - name: the bin/ tools parse
        shell: bash
        run: |
          start=$(date +%s)
          # they are executables without a .py extension, so pytest's
          # collection never touches most of them; a syntax error would
          # otherwise reach a runner before it reaches CI.
          fail=0
          for f in bin/*; do
            head -1 "$f" | grep -q python || continue
            .venv/bin/python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "::error file=$f::does not parse"; fail=1; }
          done
          end=$(date +%s)
          echo "TIMING label=$CI_LABEL step=bin-parse seconds=$((end - start))"
          exit $fail

      # A final step, not a trap in the ones above, so the total prints even
      # when a step above it fails (`if: always()`) — the timing number is
      # exactly as useful for a red run as a green one. Reads the start
      # timestamp the `stamp` step dropped under $RUNNER_TEMP (L3) rather
      # than reusing a shell variable, since each `run:` step is its own
      # shell.
      - name: total
        if: always()
        shell: bash
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            stamp_file="$RUNNER_TEMP/ci-timing-start-$CI_LABEL"
          else
            stamp_file="/tmp/ci-timing-start-${GITHUB_RUN_ID:-unknown}-$CI_LABEL"
          fi
          job_start=$(cat "$stamp_file" 2>/dev/null || echo "")
          if [ -n "$job_start" ]; then
            now=$(date +%s)
            echo "TIMING label=$CI_LABEL step=total seconds=$((now - job_start))"
          else
            echo "TIMING label=$CI_LABEL step=total seconds=unknown"
          fi

  # The reach probe is the evidentiary basis for the ADR this plan files
  # (0024 §2, §4 Definition of done): the ADR's table cites this job's own
  # `REACH`/`ROUTE` lines for a commit, rather than a claim about what a label
  # can reach. It runs on the same matrix as `tests`, for the same reason —
  # the comparison needs both labels' output side by side, on `cihost` today
  # and on `cihost-linux` once the operator applies the runner settings in
  # `external:cihost-runner-config` (plan 0024 §2: `docker_host: "-"`,
  # `privileged: false`, `valid_volumes: []`). Until that config lands,
  # `cihost-linux` simply does not run for a given push, which is the
  # operator bringing the label up, not a failure of this job.
  probe-reach:
    strategy:
      fail-fast: false
      matrix:
        label: [cihost, cihost-linux]
    name: probe-reach (${{ matrix.label }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - name: probe absolute host paths and the two routes back
        shell: bash
        run: |
          # Absolute paths only, never `~`: inside the cihost-linux image
          # $HOME is /root, so a tilde probe would report "not reachable"
          # because /root/agent does not exist — the wrong reason, not the
          # host being out of reach (plan 0024 §2). Reachability only, never
          # content: this uses `test -e` / `test -r`, and never `cat`s
          # anything, on these three paths and no others.
          paths="/Users/operator/agent /Users/operator/.claude/settings.json /opt/homebrew/var/forgejo/data"

          fail=0
          label="${{ matrix.label }}"

          for p in $paths; do
            if [ -e "$p" ] && [ -r "$p" ]; then
              reachable=yes
            else
              reachable=no
            fi
            echo "REACH path=$p reachable=$reachable"
            if [ "$label" = "cihost-linux" ] && [ "$reachable" = "yes" ]; then
              echo "::error::path $p is reachable from cihost-linux"
              fail=1
            fi
          done

          # Route 1: a Docker socket reachable from inside the job. The
          # socket file and DOCKER_HOST are reported as two separate lines,
          # not ORed into one, because the first real cihost-linux run
          # (commit 6f89870) showed docker-socket=open with all three paths
          # unreachable, and the OR gave no way to tell which of the two
          # tripped it. Plan 0024 §2 names both as routes back to the host —
          # a mounted socket file, or a daemon URL — so both are checked, but
          # a string is not automatically a socket: the runner is documented
          # to export DOCKER_HOST process-wide once ANY job on the runner
          # names a docker label, independent of this job's own executor, so
          # its mere presence proves nothing about this container's reach.
          if [ -e /var/run/docker.sock ]; then
            docker_socket_file=present
            ls -la /var/run/docker.sock
          else
            docker_socket_file=absent
          fi
          echo "ROUTE docker-socket-file=$docker_socket_file"

          if [ -n "${DOCKER_HOST:-}" ]; then
            docker_host_env="$DOCKER_HOST"
          else
            docker_host_env=unset
          fi

          # tcp:// and ssh:// always name a real daemon over the network. A
          # unix:// value only reaches something if the path it names exists
          # inside this container; if it does not, the string is inert.
          docker_host_is_route=no
          docker_host_note=""
          case "$docker_host_env" in
            unset)
              ;;
            unix://*)
              host_sock_path="${docker_host_env#unix://}"
              if [ -e "$host_sock_path" ]; then
                docker_host_is_route=yes
              else
                docker_host_note=" (path absent inside container)"
              fi
              ;;
            *)
              docker_host_is_route=yes
              ;;
          esac
          echo "ROUTE docker-host-env=$docker_host_env$docker_host_note"

          # Summary line the cihost-linux gate keys on: open means a real
          # route exists — the socket file is present, or DOCKER_HOST is a
          # non-unix URL, or a unix:// DOCKER_HOST whose file exists in this
          # container. A unix:// DOCKER_HOST whose file is absent here is
          # excluded on purpose (see above) so an exported-but-inert env var
          # cannot fail cihost-linux on its own.
          if [ "$docker_socket_file" = "present" ] || [ "$docker_host_is_route" = "yes" ]; then
            docker_route=open
          else
            docker_route=closed
          fi
          echo "ROUTE docker-socket=$docker_route"
          if [ "$label" = "cihost-linux" ] && [ "$docker_route" = "open" ]; then
            echo "::error::docker-socket route is open on cihost-linux"
            fail=1
          fi

          # Route 2: a bind mount from the host. /proc/mounts does not exist
          # on macOS — expected on the `cihost` label, not a probe failure,
          # so that label reports n/a rather than closed.
          #
          # DEFAULT-DENY, not a denylist: a bind mount's SOURCE column is the
          # backing device or share tag — `/dev/vda1`, a virtiofs tag,
          # `user@host:/path` for sshfs — never the host path, so no check on
          # `src` (fstype, or a literal `/Users`) can ever fire. Reviewed
          # 2159 verified this with two lines that both slipped a denylist
          # keyed on fstype/`/Users`: an sshfs mount of the operator's whole
          # home at `/h`, and an ext4-backed bind at `/data`. So every mount
          # point is treated as a host mount UNLESS it is in the known-benign
          # set below — the image's own root and its standard pseudo-
          # filesystems, the daemon-owned identity binds every container gets,
          # act's own internal volume, and the runner's own workspace/temp
          # dirs. Anything else prints its mount point and fstype (never the
          # source column — it can carry a hostname) and opens the route.
          is_benign_mount() {
            case "$1" in
              /) return 0 ;;
              /proc|/proc/*) return 0 ;;
              /sys|/sys/*) return 0 ;;
              /dev|/dev/*) return 0 ;;                     # /dev/pts, /dev/shm, /dev/mqueue
              /etc/hosts|/etc/hostname|/etc/resolv.conf) return 0 ;;
              /var/run/act|/var/run/act/*) return 0 ;;
              /run/act|/run/act/*) return 0 ;;
            esac
            for w in "${ws_points[@]}"; do
              [ "$1" = "$w" ] && return 0
            done
            return 1
          }

          # The runner workspace: $GITHUB_WORKSPACE and every parent up to
          # /workspace, since act's own layout binds more than one of those
          # levels. /workspace itself is always allowed even when
          # $GITHUB_WORKSPACE is unset or lies elsewhere. $RUNNER_TEMP and
          # $RUNNER_TOOL_CACHE are runner-managed, per-job scratch space.
          ws_points=("/workspace")
          if [ -n "${GITHUB_WORKSPACE:-}" ]; then
            p="$GITHUB_WORKSPACE"
            ws_points+=("$p")
            while case "$p" in /workspace/*) true ;; *) false ;; esac; do
              p="${p%/*}"
              ws_points+=("$p")
            done
          fi
          [ -n "${RUNNER_TEMP:-}" ] && ws_points+=("$RUNNER_TEMP")
          [ -n "${RUNNER_TOOL_CACHE:-}" ] && ws_points+=("$RUNNER_TOOL_CACHE")

          if [ -r /proc/mounts ]; then
            host_route=closed
            while read -r src mnt fstype _rest; do
              is_benign_mount "$mnt" && continue
              host_route=open
              echo "HOSTMOUNT point=$mnt fstype=$fstype"
            done < /proc/mounts
          else
            host_route=n/a
          fi
          echo "ROUTE host-mount=$host_route"
          if [ "$label" = "cihost-linux" ] && [ "$host_route" = "open" ]; then
            echo "::error::host-mount route is open on cihost-linux"
            fail=1
          fi

          # On `cihost` this job only reports: reachable and open are the
          # documented, expected state there today (plan 0024 §2 — talos #12's
          # CI failure showed all three paths reachable), so `cihost` always
          # exits 0. `cihost-linux` is the DoD gate: it fails if any path is
          # reachable or either route is open.
          if [ "$label" = "cihost-linux" ]; then
            exit $fail
          fi
          exit 0
