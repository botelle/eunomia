name: Plans

# The cheap gate for the two trees whose suite checks are small enough to run on
# their own: `plans/**` and `docs/adr/**`. NOT docs/ as a whole — the suite EXECUTES
# docs/launch-preamble.md and docs/takeover.md, and this workflow does not, so
# ignoring docs/ in ci.yml would leave those two files with no gate at all. An
# addition here must come with the equivalent check, not just the trigger: a path
# leaves the suite only with every suite check that reads it.
# `ci.yml` ignores those trees, so without this workflow a plans-only or ADR-only PR
# would carry NO status at all. Skipping the suite must not mean skipping the checks
# that read them: `fleet-plan lint` (what `test_repo_plans_are_valid` calls) and the
# ADR readers listed in COVERED_BY_THE_FAST_LANE in tests/test_ci_workflow.py, which
# is the one place that list lives — the `fast lane` step below reads it from there.
#
# The ADR readers need pytest, and one imports bin/orchestrator, so this job now
# builds a venv with the same pinned requirements ci.yml uses (it was stdlib-only
# before). The four-minute suite still does not run: those tests take seconds.
#
# It also keeps a review dispatchable. `dispatch-review.py:ci_verdict` treats a
# missing status on a repo that DOES configure workflows as a warning to
# investigate rather than a clean pass, so a statusless plan PR would be reviewed
# under a caveat every time. A real green is better than a warning nobody reads.

on:
  push:
    paths:
      - 'plans/**'
      - 'docs/adr/**'
    # Same lane-branch exclusion as ci.yml, and for the same reason (see the
    # comment there): a test lane result under agent/tests/<plan>/<runner>
    # must trigger neither workflow, not just the suite-running one.
    branches-ignore:
      - 'agent/tests/**'

# Same per-ref key as ci.yml, for the reason stated there (plan 0113 D4): one
# ref's CI, Plans and deploy-docsite runs still queue together — the collision
# ci.yml describes is the runner's shared per-repository workspace, not the
# workflow identity — and different branches no longer wait on each other.
concurrency:
  group: eunomia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: cihost
    timeout-minutes: 5
    # Same four identity vars as ci.yml's `tests` job, for the same reason
    # (git operations outside the tests suite need ambient identity the
    # cihost-linux image doesn't supply). CI_LABEL is a literal here, not a
    # matrix expression — this job has no matrix — but it plays the same
    # role: the pinned steps below read $CI_LABEL, not matrix.label.
    env:
      GIT_AUTHOR_NAME: forgejo-runner
      GIT_AUTHOR_EMAIL: runner@cihost.example
      GIT_COMMITTER_NAME: forgejo-runner
      GIT_COMMITTER_EMAIL: runner@cihost.example
      CI_LABEL: cihost-first-push
    steps:
      # fetch-depth: 0 so `scope` below can diff against the real merge base.
      # It costs this lane its shallow clone, which is the price of asking the
      # right question — see that step. The `cihost` runner's workspace is a
      # persistent per-repository checkout, so the history is fetched once and
      # reused, not re-cloned per run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Plan 0113 D2: this job runs the full suite too, when `scope` below
      # finds the change leaves the fast lane, so it shares `tests`' (and
      # talos-contract's) pip cache and pytest base temp. Same per-run+per-job
      # key as the other two jobs' own scratch steps.
      - name: per-run scratch (plan 0113)
        shell: bash
        run: |
          scratch="${RUNNER_TEMP:-/tmp}/0113-r${GITHUB_RUN_ID:-0}-${CI_LABEL:-lint}"
          rm -rf "$scratch"
          mkdir -p "$scratch/tmp" "$scratch/pip"
          {
            echo "TMPDIR=$scratch/tmp"
            echo "PIP_CACHE_DIR=$scratch/pip"
            echo "EUNOMIA_0113_SCRATCH=$scratch"
          } >> "$GITHUB_ENV"

      # A code branch can land in THIS workflow and skip the suite entirely,
      # taking this workflow's green over untested code. The review dispatcher
      # consumes that green automatically and cannot read a comment, so the
      # mitigation has to be a job.
      #
      # It happens because the forge filters workflows on the PUSH diff (the
      # `before` SHA to the `after` SHA), which is not the change. Three ways of
      # pushing make the two disagree, and this gate no longer tries to
      # enumerate them:
      #
      #   (a) FIRST PUSH — filtered on the tip commit alone (ci.yml, FIRST PUSH
      #       (a)). A branch whose last commit touches only plans/ skips.
      #   (b) MERGE-COMMIT TIP — the file list comes back empty (ci.yml (b)).
      #       Both workflows skip and the head gets no status, which is the safe
      #       direction and stays unmitigated.
      #   (c) FORCE PUSH — `before` is a real SHA that is not an ancestor of
      #       `after`, so the push diff is the REBASE DELTA. Measured on #211
      #       (2026-09-08): a branch changing one file, tests/test_launchd_units.py,
      #       was rebased onto a main that had moved only in plans/. Push diff
      #       plans-only, suite skipped, `Plans / lint` green, and a review round
      #       was cleared on a commit nobody had built.
      #
      # (c) is why this is no longer gated on the zero SHA. That gate encoded
      # ci.yml's claim that "every later push to the branch has a real `before`
      # SHA and ci.yml decides correctly" — which a force-push falsifies, and a
      # rebase before opening a PR is routine.
      #
      # So stop proxying. Ask what the CHANGE contains, not how it arrived:
      # `merge-base..HEAD` is the same range the reviewer and the PR see, and it
      # is unaffected by how the branch was pushed. Still narrow — a genuinely
      # plans-only PR skips the suite exactly as before, which is what keeps this
      # lane fast and the ignore list paying for itself. The fast lane is
      # plans/ and docs/adr/, the same two globs as ci.yml's paths-ignore.
      - name: scope — does this change leave the fast lane?
        id: scope
        shell: bash
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main
          base=$(git merge-base origin/main HEAD || true)
          head=$(git rev-parse HEAD)
          if [ -z "$base" ] || [ "$base" = "$head" ]; then
            # HEAD is main, or an ancestor of it: there is no branch change to
            # scope. Pushes to main are ci.yml's business.
            echo "on main (or an ancestor) — fast lane only"
            echo "full_suite=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames is load-bearing, not tidiness. git's rename detection
          # is ON by default and prints only a rename's DESTINATION, so
          # `git mv docs/launch-preamble.md plans/lp.md` reports `plans/lp.md`
          # alone — the gate sees a plans-only change and skips the suite over a
          # tree that just lost a file. Not a hypothetical file: the suite
          # EXECUTES docs/launch-preamble.md (tests/test_fleet_cr.py runs every
          # fenced block in it), which is exactly why ci.yml refuses to ignore
          # docs/**. With --no-renames the deletion and the addition are both
          # printed, and the deletion is what fails the plans/ filter.
          outside=$(git diff --no-renames --name-only "$base" "$head" | grep -v -e '^plans/' -e '^docs/adr/' || true)
          if [ -n "$outside" ]; then
            echo "this change leaves plans/ and docs/adr/:"
            echo "$outside" | sed 's/^/  /'
            # The suite below is a copy of ci.yml's, for the pushes where the
            # forge skipped ci.yml. When ci.yml DID run on this commit, the copy
            # is the same fifteen minutes run twice, queued behind the first on
            # the one cihost runner. That made a PR commit's CI ~31 minutes
            # against the review dispatcher's 1800 s wait (eunomia #1062, #1064,
            # 2026-10-24); a main merge, scoped out above, took 13 s.
            #
            # So ask the forge whether ci.yml has a run on this commit. That is
            # an observation, not a reconstruction of the forge's path filter —
            # the reconstruction is what (a)-(c) above broke. Both runs are
            # created by the same push, so the answer is already there. Anything
            # short of a clear yes — none found, an API error, no token — runs
            # the suite: the failure direction is today's duplicate, never a
            # green over untested code.
            #
            # The query filters are measured, not assumed: on this forge
            # (/api/v1/version 15.0.2, 2026-10-25) `head_sha=` returned ci.yml
            # and plans.yml for a mixed commit (c7136f9c) and plans.yml alone
            # for a plans-only one (ca51004b), and `event=pull_request` returned
            # none. bin/fleetforge.py's list_action_runs pages unfiltered only
            # because no caller needed these. Correctness does not rest on them
            # either: the snippet re-checks workflow_id and commit_sha, so a
            # forge that ignored the filters could only answer "none", which
            # runs the suite. `-I` keeps the branch's own files off sys.path
            # while FORGE_TOKEN is in the environment.
            rc=0
            ci_runs=$(python3 -I -c '
          import json, os, sys, urllib.request
          head = sys.argv[1]
          try:
              ask = urllib.request.Request(
                  "%s/api/v1/repos/%s/actions/runs?event=push&limit=50&head_sha=%s"
                  % (os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], head),
                  headers={"Authorization": "token " + os.environ["FORGE_TOKEN"]})
              on_head = json.load(urllib.request.urlopen(ask, timeout=30))["workflow_runs"]
              ci = [str(run["id"]) for run in on_head
                    if run.get("workflow_id") == "ci.yml" and run.get("commit_sha") == head]
          except Exception as failed:
              # The class name only. http.client puts a rejected header value,
              # token included, in the ValueError text, and an uncaught
              # traceback goes to stderr, which is the job log.
              print("forge query failed: " + type(failed).__name__, file=sys.stderr)
              sys.exit(1)
          if not ci:
              sys.exit(3)
          print(" ".join(ci))
          ' "$head") || rc=$?
            if [ "$rc" -eq 0 ] && [ -n "$ci_runs" ]; then
              echo "ci.yml run(s) $ci_runs carry the suite for $head — not running it twice"
              echo "full_suite=false" >> "$GITHUB_OUTPUT"
            else
              if [ "$rc" -eq 3 ]; then
                echo "no ci.yml run on $head (the forge skipped it) — the suite runs below"
              else
                echo "::warning::could not ask the forge for ci.yml's runs on $head (exit $rc) — running the suite"
              fi
              echo "full_suite=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "plans/ and docs/adr/ only ($base..$head) — fast lane only"
            echo "full_suite=false" >> "$GITHUB_OUTPUT"
          fi

      # The two steps below (`install`, `full suite (when the change
      # leaves the fast lane)`) are verbatim copies of ci.yml's `tests` job's `install` and
      # `tests` steps; test_the_first_push_suite_matches_ci keeps them
      # identical, because a drifted copy is a mitigation that stops
      # mitigating without failing. PINNED VERBATIM — edit ci.yml first, then
      # copy its `run:` bodies here unchanged, or the test fails.
      # Unconditional: the fast lane's ADR readers need pytest too.
      - name: install
        shell: bash
        run: |
          start=$(date +%s)
          python3 -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          # pytest-randomly is deliberate: this suite's env-leak class of bug
          # (a var read at import, not cleared between loads) is invisible in
          # a fixed order and was found twice by random ordering.
          .venv/bin/python -m pip install -q pytest pytest-randomly
          end=$(date +%s)
          echo "TIMING label=$CI_LABEL step=install seconds=$((end - start))"

      - name: full suite (when the change leaves the fast lane)
        if: ${{ steps.scope.outputs.full_suite == 'true' }}
        shell: bash
        run: |
          start=$(date +%s)
          # -rs: a skip's reason goes to the job log, not only a count — the
          # root-user chmod-lease skip is otherwise invisible next to a bare
          # "1 skipped".
          .venv/bin/python -m pytest -q -rs
          end=$(date +%s)
          echo "TIMING label=$CI_LABEL step=tests seconds=$((end - start))"

      # The suite tests that read plans/ or docs/adr/ — the checks that left the
      # suite with those paths. The list is COVERED_BY_THE_FAST_LANE in
      # tests/test_ci_workflow.py, printed by that file so the lane and the
      # guard that polices the ignore list cannot drift. Always runs: whether
      # an ADR changed is not computable on a push to main.
      - name: fast lane — the suite tests that read plans/ and docs/adr/
        shell: bash
        run: |
          # bash 3.2 (cihost's /bin/bash) has no mapfile; tests/test_ci_workflow.py
          # refuses bash-4-only builtins in workflows. Capture first so a failing
          # list command fails the step instead of yielding an empty list.
          list=$(python3 tests/test_ci_workflow.py --fast-lane-tests) || {
            echo "::error::could not list the fast-lane tests"
            exit 1
          }
          fast=()
          while IFS= read -r t; do [ -n "$t" ] && fast+=("$t"); done <<< "$list"
          if [ ${#fast[@]} -eq 0 ]; then
            echo "::error::no fast-lane tests listed"
            exit 1
          fi
          .venv/bin/python -m pytest -q -rs "${fast[@]}"

      - name: fleet-plan lint
        shell: bash
        run: |
          shopt -s nullglob
          plans=(plans/*.md)
          if [ ${#plans[@]} -eq 0 ]; then
            echo "::error::no plans found — plans/ is empty or the checkout is wrong"
            exit 1
          fi
          python3 bin/fleet-plan lint "${plans[@]}"

      - name: per-run scratch cleanup (plan 0113)
        if: always()
        shell: bash
        run: rm -rf "${EUNOMIA_0113_SCRATCH:-/nonexistent}"
