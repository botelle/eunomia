# secret-patterns.conf — the fleet's one source of truth for "what a secret
# looks like". Versioned: extending this list is a PR, not an edit. One rule
# per line: KIND<TAB>NAME<TAB>REGEX
# KIND = path     (matched against Read/Grep targets AND path-shaped tokens in Bash)
#      | cmd      (matched against the whole Bash command string)
#      | content  (matched against CR text fields: target/intent/patch)
# Consumers: bin/fleet-secret-guard reads path + cmd (it ignores content);
# fleetlib.validate_cr reads content only (at CR file time AND apply time).
# Regexes are case-insensitive. Keep them tight: over-blocking teaches sessions
# to route around the guard, which is worse than the occasional manual override.

# --- env files: every fleet leak so far started in one
path	env-file	(^|/)[A-Za-z0-9._-]*\.env$

# --- the keyvault credential tree on vaulthost/opshost
# The carve-outs are the forgejo-broker's own non-credential files (infra
# ADR-0003). They hold no secret — the JSONL audit trail carries a token
# FINGERPRINT by design, never the PAT — and without them no session could
# smoke-test the broker or read its audit trail, which is the over-blocking
# this file's header warns teaches sessions to route around the guard.
#
# EXACT FILENAMES, deliberately. The first cut of this exempted `broker/`
# as a subtree, and `~/bao/broker/../.admin.role_id` then sailed straight
# through — a one-token bypass of the highest-value rule in this file
# (#108 review 2101). Anything that names a DIRECTORY here is traversable,
# so nothing does: each alternative names ONE FILE and is end-anchored, so
# every segment is fixed and none can be stepped through. (Each is
# `dir/file`, so there is one slash — what matters is that no segment is
# unbounded, not that there is no slash.) A new broker file needs a PR,
# which is what the header at the top of this file already says.
#
# THE .log EXEMPTION RESTS ON THE BROKER'S LOGGING DISCIPLINE, and that
# code lives in operator/keyvault, not here. Today it prints decisions and
# a token FINGERPRINT, and it suppresses tracebacks precisely so an
# exception raised near the PAT cannot quote it. If anyone adds request
# or header logging to the broker, this line becomes a permanent read
# channel the guard cannot see — change it here in the same breath.
#
# Belt and braces: bin/fleet-secret-guard now normalises paths before
# matching, so `..` cannot reach any rule. Both are kept — the guard's
# normalisation protects every rule, and this bound means THIS rule is not
# relying on it.
#
# Everything else stays protected, INCLUDING logs/audit.log (the vault's
# OWN audit device, which is not the broker's) and the
# .<role>.{role_id,secret_id,field} credential files this rule exists for.
path	bao-tree	(^|/)bao/(?!run/forgejo-broker\.sock$|logs/forgejo-broker\.jsonl$|logs/forgejo-broker\.log$|broker/forgejo_broker\.py$|broker/forgejo-broker-query\.sh$).*[^/]$

# --- cloudflared: config + token env (the 2026-08-27 tunnelhost leak)
path	cloudflared	(^|/)(etc/)?cloudflared/[^ ]*$|(^|/)\.cloudflared(/|$)

# --- Claude Code + bot credentials at rest
path	claude-creds	(^|/)\.credentials\.json$
path	forgejo-bot-token	(^|/)\.forgejo-token-[A-Za-z0-9._-]+$
path	cf-stash	(^|/)\.cf-[A-Za-z0-9._-]*token[A-Za-z0-9._-]*$

# --- private key material
path	private-key	(^|/)id_(rsa|ed25519|ecdsa)[A-Za-z0-9._-]*$|(?<!fullchain)(?<!chain)(?<!cert)(?<!pubkey)\.pem$|\.p8$|\.p12$|\.keystore$|(^|/)privkey\.pem$

# --- command-shaped rules: reads that expose credentials without touching a file path
cmd	systemd-cloudflared	systemctl\s+(cat|show)\s+[^;|&]*cloudflared
path	proc-environ	/proc/.+/environ$
cmd	proc-environ-cmd	/proc/\S*/environ\b|/proc/[^/]*\$\S*/environ
cmd	launchctl-print-env	launchctl\s+print[^;|&]*\|\s*grep\s+-i[a-z]*\s+(token|secret|key|password)

# --- the guard's own installed copy (#222)
# The hook executes ~/.local/share/pins/<repo>/bin/fleet-secret-guard for EVERY
# session on the machine. Until this rule, a session could rewrite that file
# with a one-line Bash redirect and disable the fleet's only code-enforced
# credential control, permanently and silently, for every other session. The
# guard's own docstring deferred this as a follow-up ("#13 r2 H", "#13 r3 M2")
# and scoped the deferral to the CONF; the executable is exposed identically.
#
# THE PIN PATH ONLY, deliberately — not bin/fleet-secret-guard in a checkout.
# The pin is the ENFORCEMENT copy, not a development surface: read and edit the
# repo copy, which these rules do not touch, so writing this fix does not
# require an override. Scoping it this way is what keeps the rule tight enough
# to obey, which the header at the top of this file asks for.
#
# `[^/]+` for the repo segment rather than a literal `eunomia`: techne is
# pinned the same way and a second pinned guard must not be unprotected by
# omission. No segment is unbounded and each alternative ends at a FILE, per
# the traversal lesson recorded above.
path	guard-pin-exe	/\.local/share/pins/[^/]+/bin/fleet-secret-guard$
path	guard-pin-conf	/\.local/share/pins/[^/]+/config/secret-patterns\.conf$

# The path rules above match a token on the command line. `git -C <pin> checkout
# -- bin/fleet-secret-guard` defeats them, because neither token is the full
# path: one is a directory, the other is relative. A pin is a detached worktree
# whose only sanctioned writer is bin/fleet-pin-watch, which runs from launchd
# and never through a PreToolUse hook — so blocking session-side mutation of a
# pin costs nothing operationally and closes the restore route.
#
# HONEST LIMIT, and the reason #222 stays open on the ownership half: a `cd`
# into the pin first leaves no `pins/` token at all, and no regex over a shell
# string can fix that. The durable control is ownership — a root-owned guard
# that `operator` cannot write — and that needs a human with root. This rule
# raises the cost; it does not close the hole.
cmd	pin-worktree-mutation	\bgit\b[^;|&]*\bpins/[^;|&]*\b(checkout|restore|reset|clean|apply|rm|mv)\b

# --- content: secret SHAPES (kind ignored by fleet-secret-guard, which reads
# only path/cmd). Read by fleetlib.validate_cr — CR intent/patch text must never
# carry a live credential (SPEC Principle 6: atlas renders the cr/ tree). Same
# high-signal shapes fleet-leak-watch pages on, plus the fleet's own currency
# (keyvault/OpenBao hvs. service tokens). Two RECORDED gaps (1522 #11 r5): 40-hex
# Forgejo PATs collide with commit shas in patches, so they are deliberately not
# a rule — treat any pasted 40-hex as suspect by eye; and openai keys carrying a
# hyphen inside their first 20 chars evade the dashless-run rule (the conscious
# trade that lets 'sk-learn-based-…' prose file cleanly).
content	github-pat	\bghp_[A-Za-z0-9]{20,}|\bgithub_pat_[A-Za-z0-9_]{20,}
content	openai-key	\bsk-(?:proj-)?[A-Za-z0-9_]{20,}
content	slack-token	\bxox[baprs]-[A-Za-z0-9-]{10,}
content	aws-key	\bAKIA[0-9A-Z]{16}\b
content	jwt-or-tunnel	\beyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}
content	private-key	-----BEGIN [A-Z ]*PRIVATE KEY-----
content	bao-token	\bhvs\.[A-Za-z0-9]{20,}
