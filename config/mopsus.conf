# Per-repo mopsus mode (plan 0046).
#
# Format, one per line:  <owner/repo|default> = <mode>
# Comments start with #.
#
#   escalate    compose a brief, page with a handle, act never      (BUILT)
#   mechanical  classify by failure reason; a class in RETRYABLE_CLASSES
#               (bin/mopsus) is released through fleet-release so the watcher
#               dispatches it again, at most `fleet-config retry_limit` times
#               per plan, each a `plan-requeued` event and NO page; every
#               other failure escalates exactly as above   (BUILT, ADR-0012)
#   triage      a model reads the failure and chooses    (named, NOT
#               built — refused by name, never treated as escalate)
#   off         nothing
#
# A repo absent from this file gets `default`'s value; a conf with no
# `default` line still resolves to `escalate` — unlike
# impl-bounds.conf/review-bounds.conf, there is no built-in-default Stop here.
# Those two conf files guard SPEND; `escalate` guards nothing, it only
# composes a brief and pages, so "assume the safe mode" is itself the safe
# behaviour for a repo nobody has configured yet (plan 0046 Boundaries).
#
# `default = mechanical` is the owner's decision, made by merging plan 0078
# (2026-09-24). The spend it can cause is bounded by `retry_limit` (0..5,
# default 2; `retry_limit = 0` is the off switch) and by the watcher's
# `dispatch_cap`. A repo can still opt out with `<owner/repo> = escalate`.

default = mechanical

# Failure classes and their action shortlists (plan 0064) are NOT configured
# here: a mode says what mopsus DOES, and a class only says what a brief
# SHOWS. They live as data in bin/mopsus (CLASS_RULES, CLASS_ACTIONS) so a
# rule and its test change together.
