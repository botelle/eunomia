# Per-repo fleet-stalled mode (plan 0060).
#
# Format, one per line:  <owner/repo|default> = <mode>
# Comments start with #.
#
#   off       nothing
#   report    name every stalled pull request, page once per (repo, PR,
#             head SHA)                                          (BUILT)
#   dispatch  act on a stalled pull request — dispatch a review, or say so
#             where a rebase is needed           (named, NOT built — a repo
#             set to this mode is refused, never silently treated as
#             report)
#
# A repo absent from this file gets `default`'s value; a conf with no
# `default` line still resolves to `report` — like mopsus's `escalate`,
# `report` guards nothing (it only composes a page), so "assume the safe
# mode" is itself the safe behaviour for a repo nobody has configured yet
# (plan 0060 Boundaries).
#
# `dispatch` is the one mode that would ACT, and it defaults off. Setting a
# repo to it here is a decision this plan does not make for you — it is
# recorded so a future plan can build the mode and this file simply starts
# working, not so today's fleet-stalled can guess at it.

default = report
