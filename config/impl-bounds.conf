# Per-repo implementer wall-clock bounds, in minutes (plan 0042).
#
# Format, one per line:  <owner/repo|default> = <int>
# Comments start with #. Unparseable lines are a DEFECT and fail loudly, in the
# shape config/review-bounds.conf established — a bound that silently reverts
# to a built-in default is an unattended process spending more than the
# operator set.
#
# There is NO value meaning unlimited. 0 is refused, not read as infinity: the
# conventional reading of a config integer is exactly the misreading that costs
# money here. Every value is clamped in code to IMPL_BOUND_CEILING, and a value
# above it is clamped with a warning rather than obeyed.
#
# The `default` line is the ONLY built-in fallback — there is no constant in
# code behind it. If this line is lost to a bad edit, that is a broken
# checkout, not a fleet that never configured itself, and the run stops rather
# than guessing.
#
# Raising a repo's bound is the wrong first instinct on a slow build or a noisy
# debug loop. A plan that needs longer usually needs splitting instead (plan
# 0042 §3).

default = 90

# operator/ares 0001 was killed at exactly this bound on 2026-09-12 (rc=143,
# seconds=5400), rebuilding a full simulator to debug a determinism trace. No
# override is given here on purpose: the fix is scoping that loop into
# `swift test`, not a bigger bound — see plan 0042 §3.
