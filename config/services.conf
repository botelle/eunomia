# Supervised processes the `service` lease (plan 0029) protects. `fleet-svc`
# reads this file; enrolling a new service is a reviewed PR editing it, never
# an environment variable (config/repos.conf's reason, plus one of this file's
# own: the incident this plan closes differed by ENVIRONMENT — plist PATH +
# DOCKER_HOST vs login PATH — so enrolment that depended on the caller's
# environment would inherit the bug it exists to close).
#
# host:unit    the FLEET-CHOSEN canonical name — never a launchd label or a
#              systemd unit name. Two supervisors of one config are ONE
#              resource; two labels over one unit is what this plan's
#              incident actually was.
# supervisor   launchd | systemd — a field, not an inference: day one already
#              spans both.
# domain       the launchctl domain target (system | gui) or the systemd scope
#              (system | user). Load-bearing for launchd: a root LaunchDaemon
#              (system) and a user LaunchAgent (gui) need different target
#              strings and different privilege — that split IS the incident.
# primary      the ONE label/unit a verb acts on. Never plural: acting on every
#              label a unit registers is the two-daemon fault, performed under
#              a lease.
# also         other labels this same unit additionally registers, comma-sep,
#              or `-`. Reported by `fleet-svc status`, never targeted by a verb.
# config       an ABSOLUTE path on the row's OWN host, or `-` if this service
#              has no gated config file. Never `~` — nothing here expands a
#              tilde, and expanding one would resolve against the wrong host's
#              home whenever fleet-svc runs elsewhere.
#
# A service with no row here is NOT protected: fleet-svc refuses an unenrolled
# name rather than passing the operation through. Raw launchctl/systemctl on an
# unenrolled service is untouched by any of this (docs/service-lease.md).

service: cihost:forgejo-runner supervisor=launchd domain=system primary=org.eunomia.forgejo-runner also=org.eunomia.forgejo.runner config=/Users/operator/agent/runner/config.yaml
service: edgehost:minos            supervisor=systemd domain=system primary=minos.service          also=- config=-
service: edgehost:intakebot            supervisor=systemd domain=system primary=intakebot.service          also=- config=-
service: opshost:fleet-watch      supervisor=launchd domain=gui    primary=org.eunomia.fleet-watch also=- config=-
service: vaulthost:keyvault         supervisor=launchd domain=gui    primary=org.eunomia.keyvault   also=- config=-

# The rest of the opshost fleet machinery, enrolled 2026-09-12. Labels, domain and
# program read off ~/Library/LaunchAgents/*.plist on opshost the same day; all five
# are user LaunchAgents, so domain=gui, and none has a gated config file.
#
# WHY THESE FIVE AND NOT EVERY opshost UNIT: each one, stuck, stops the dispatch
# flow in a way the operator cannot see from the outside. fleet-broker-tunnel
# was sitting at exit status 255 when this row was written, which is the whole
# argument in one line — the protection verdict rides that socket, so the
# watcher arms nothing while it is down and nothing says so.
#
# opshost:pin-watch runs bin/fleet-watch --pins-only — the SAME program as
# opshost:fleet-watch, under a different label with a different flag. That is two
# services, not one service registering twice, so they are two rows and neither
# carries the other in `also`. The distinction matters because `also` exists to
# stop a verb acting on a second label of ONE unit; using it here would make a
# restart of the dispatcher also restart the pin checker.
service: opshost:fleet-collect    supervisor=launchd domain=gui    primary=org.eunomia.fleet-collect     also=- config=-
service: opshost:pin-watch        supervisor=launchd domain=gui    primary=org.eunomia.fleet-pin-watch   also=- config=-
service: opshost:pin-advance      supervisor=launchd domain=gui    primary=org.eunomia.fleet-pin-advance also=- config=-
service: opshost:leak-watch       supervisor=launchd domain=gui    primary=org.eunomia.fleet-leak-watch  also=- config=-
service: opshost:broker-tunnel    supervisor=launchd domain=gui    primary=org.eunomia.fleet-broker-tunnel also=- config=-
