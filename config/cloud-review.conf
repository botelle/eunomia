# Repositories fleet-cloud-review may send to the cloud-review mirror, and the limits.
#
# EACH `repo =` LINE IS A DECISION TO PLACE THAT REPOSITORY'S HISTORY ON GITHUB.
# The tool pushes the pull request's base and head commits, and so everything
# reachable from them, to a third party. An absent, unreadable or empty file
# refuses every request.
#
# The limits are here, not in code or a flag, so that changing one is a
# reviewed change. docs/cloud-review.md says what they were set from.

mirror = operator/review-mirror
credit_expires = 2026-11-05
max_requests = 40
reviews_per_session = 5

repo = operator/lynceus
