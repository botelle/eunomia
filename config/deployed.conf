# Deployed services fleet-drift polls (plan 0098).
#
# <services.conf name> <healthz URL> [allow=<hours>]
#
# The name must be a `service:` name in config/services.conf. The URL must
# answer JSON with a boolean `up_to_date` — the service's OWN verdict on whether
# it runs main's code; fleet-drift never computes one. allow defaults to 24:
# how long a spell of behind/unknown may last before one page. A service that
# does not report the field yet sits at unknown and pages "cannot tell".
# A malformed line, an unknown name or a duplicate refuses the whole file.
edgehost:minos http://edgehost:8790/healthz
