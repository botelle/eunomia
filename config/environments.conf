# Deploy bindings (ADR-0015, plan 0087). `bin/fleet-deploy` reads this file;
# a service is deployed only if a reviewed PR binds it here — never an
# environment variable, for the reason config/services.conf gives.
#
# bind: <env>:<name>   env is `dev` only; stage and prod are reached by
#                      promotion (ADR-0015 §7), never bound directly.
# provider   homefleet — the only provider fleet-deploy implements.
# repo       owner/repo whose `main` is deployed. Its deploy/manifest.json is
#            the contract; nothing here duplicates it.
# service    host:unit of an ENROLLED config/services.conf row. The host is
#            the machine that acts on the binding; the restart goes through
#            fleet-svc's gate.
# pin        ABSOLUTE path of the worktree the service runs from. Never `~`.
# base_url   where the health check is made, http(s)://host[:port].
#
# A malformed line stops the whole run, naming it: a half-read file that
# silently deploys some services is worse than none.

bind: dev:lynceus provider=homefleet repo=operator/lynceus service=opshost:lynceus pin=/Users/operator/.local/share/pins/lynceus base_url=http://192.0.2.5:8795
