# Per-repo fix-round bounds for the orchestrator's review loop (plan 0011).
#
# Format, one per line:  <owner/repo|default> = <int>
# Comments start with #. Unparseable lines are a DEFECT and fail loudly, in the
# shape config/secret-patterns.conf established — a bound that silently reverts
# to the default is an unattended process spending more than the operator set.
#
# There is NO value meaning unlimited. 0 is refused, not read as infinity: the
# conventional reading of a config integer is exactly the misreading that costs
# money here. Every value is clamped in code to REVIEW_BOUND_CEILING, and a
# value above it is clamped with a warning rather than obeyed.
#
# Raising a repo's bound is the wrong first instinct on a noisy repo. Rounds are
# exhausted because findings are not converging, which usually means the plan is
# wrong — and a plan defect is a human decision, not more rounds (plan 0011 §3).

default = 5
