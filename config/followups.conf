# Per-repo fleet-followups timer.
#
# Format, one per line:  <owner/repo|default> = <hours>
# Comments start with #.
#
#   -1   off: the repo's follow-up issues are never read or triaged
#   N    triage the repo at most once every N hours (N >= 1)
#
# A repo absent from this file gets `default`'s value, and `default` is -1,
# so every repo starts OFF and is opted in one at a time. Each triage is a
# model session, so turning a repo on is a spend decision; see the repo's
# open `Follow-ups from review of #N` count before choosing its interval.
#
# The unit fires hourly. A run takes only repos whose interval has elapsed
# since their last completed run (~/dev/.fleet/followups-last-run.json), and
# `followup_triage_batch` (fleet-config) still caps the issues per run.
#
# Example:  operator/eunomia = 24

default = -1

# Pilot, owner decision 2026-10-11: eunomia only, once a day. 300 follow-up
# issues were open that day, none ever triaged. At the default batch of 10 that
# is at most 10 sessions a day. Read ~/dev/.fleet/followups.log and the first
# batch's comments before widening this to another repo or a shorter interval.
operator/eunomia = 24
