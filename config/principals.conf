# Whose Claude credential a repository's implementer runs spend (plan 0125).
#
# Two line shapes, `#` comments, no nesting:
#
#   principal: <name>  kind: oauth_token|api_key  cmd: <token helper path>
#   repo: <owner/repo>  principal: <name>
#
# A repository with no `repo:` line belongs to the operator, whose helper is
# FLEET_CLAUDE_TOKEN_CMD. `operator` is not declared here. A `repo:` line naming
# an undeclared principal is a parse error, and so is a line that does not match
# either shape: a credential map that drops a line spends the wrong login.
#
# `kind` says whose credential the helper holds. A `setup-token` belongs to ONE
# seat, so `oauth_token` is one person's own seat and `api_key` is a venture's
# metered key; never one partner's seat standing in for another's work.
#
# This file names a helper; the helper holds the reach. Never put a credential,
# a vault path's contents or a helper's output here. A venture's helper that
# fails stops that venture's run and closes `credential:<name>`; it is never
# served from the operator's login.
#
# Empty on purpose: every repository is the operator's until a line is added.
