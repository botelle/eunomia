<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"><style>
 .t{font-size:34px;font-weight:700;fill:#1c1c1c}
 .st{font-size:20px;fill:#5c6670}
 .meta{font-size:18px;fill:#8a9099}
 .h{font-size:21px;font-weight:700;fill:#1c1c1c}
 .b{font-size:17px;fill:#3d454d}
 .host{font-size:20px;font-weight:700;fill:#5c6670}
 .lbl{font-size:16px;fill:#3d454d}
 .num{font-size:16px;font-weight:700;fill:#9a3412}
 .lg{font-size:17px;fill:#3d454d}
 .note{font-size:17px;fill:#8a9099;font-style:italic}
 .col{font-size:18px;font-weight:700;fill:#5c6670}
</style><defs><marker id="ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="#8a9099"/></marker><marker id="ao" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="#9a3412"/></marker></defs><rect class="bg" width="1600" height="1130" fill="#ffffff"/><text class="t" x="40" y="56">PR ledger fed by webhooks — what runs where</text><text class="st" x="40" y="90">One PR event, from Forgejo to a dispatch decision. The ledger is fast; the search makes it safe.</text><text class="meta" x="40" y="118">version 0.2 DRAFT · 2026-11-05 · Fleet Operator · plan 0209 redesign</text><rect class="panel" x="40" y="160" width="440" height="720" rx="14" fill="#fafafa" stroke="#d0d5da" stroke-width="2"/><text class="host" x="60" y="192">cihost (macOS) — Forgejo 15</text><rect class="panel" x="560" y="160" width="1000" height="720" rx="14" fill="#fafafa" stroke="#d0d5da" stroke-width="2"/><text class="host" x="580" y="192">opshost (macOS) — the fleet</text><rect x="80" y="220" width="360" height="110" rx="10" fill="#eef2fd" stroke="#1d4ed8" stroke-width="2.5"/><text class="h" x="260.0" y="260" text-anchor="middle">Forgejo repos</text><text class="b" x="260.0" y="284" text-anchor="middle">operator/* — PRs, reviews,</text><text class="b" x="260.0" y="306" text-anchor="middle">plans/ on main</text><rect x="80" y="400" width="360" height="110" rx="10" fill="#eef2fd" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="8 6"/><text class="h" x="260.0" y="440" text-anchor="middle">Repo webhook (new)</text><text class="b" x="260.0" y="464" text-anchor="middle">pull_request + push</text><text class="b" x="260.0" y="486" text-anchor="middle">→ opshost :8798, HMAC</text><rect x="80" y="600" width="360" height="140" rx="10" fill="#eef2fd" stroke="#1d4ed8" stroke-width="2.5"/><text class="h" x="260.0" y="644" text-anchor="middle">REST API :3001</text><text class="b" x="260.0" y="668" text-anchor="middle">GET /pulls/{n}</text><text class="b" x="260.0" y="690" text-anchor="middle">GET /issues?q=&lt;plan id&gt;</text><text class="b" x="260.0" y="712" text-anchor="middle">GET /pulls (full list)</text><rect x="620" y="220" width="400" height="120" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2.5" stroke-dasharray="8 6"/><text class="h" x="820.0" y="265" text-anchor="middle">fleet-prhook :8798</text><text class="b" x="820.0" y="289" text-anchor="middle">checks HMAC; the payload</text><text class="b" x="820.0" y="311" text-anchor="middle">is a trigger, never a fact</text><rect x="620" y="420" width="400" height="110" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6"/><text class="h" x="820.0" y="460" text-anchor="middle">fleet.db — pr_ledger</text><text class="b" x="820.0" y="484" text-anchor="middle">one row per PR, any state</text><text class="b" x="820.0" y="506" text-anchor="middle">plus last event time</text><rect x="620" y="640" width="400" height="140" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2.5" stroke-dasharray="8 6"/><text class="h" x="820.0" y="684" text-anchor="middle">Backstops</text><text class="b" x="820.0" y="708" text-anchor="middle">catch-up walk every 10 min</text><text class="b" x="820.0" y="730" text-anchor="middle">daily full listing</text><text class="b" x="820.0" y="752" text-anchor="middle">missed event → logged</text><rect x="1120" y="220" width="400" height="120" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/><text class="h" x="1320.0" y="265" text-anchor="middle">fleet-watch --resident</text><text class="b" x="1320.0" y="289" text-anchor="middle">sleeps 120 s between</text><text class="b" x="1320.0" y="311" text-anchor="middle">cycles (cycle: 10–20 min)</text><rect x="1120" y="420" width="400" height="110" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2.5" stroke-dasharray="8 6"/><text class="h" x="1320.0" y="460" text-anchor="middle">Dispatch gate</text><text class="b" x="1320.0" y="484" text-anchor="middle">canary search, then</text><text class="b" x="1320.0" y="506" text-anchor="middle">“Plan: &lt;id&gt;” must be absent</text><rect x="1120" y="640" width="280" height="90" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/><text class="h" x="1260.0" y="681" text-anchor="middle">orchestrator</text><text class="b" x="1260.0" y="705" text-anchor="middle">spawned for the plan</text><path d="M260 330 L260 400" stroke="#8a9099" stroke-width="2.5" fill="none" marker-end="url(#ag)"/><text class="lbl" x="275" y="370" text-anchor="start">PR opened / edited /</text><text class="lbl" x="275" y="390" text-anchor="start">closed / merged</text><path d="M440 455 L520 455 L520 260 L620 260" stroke="#8a9099" stroke-width="2.5" fill="none" marker-end="url(#ag)"/><text class="num" x="532" y="250" text-anchor="start">1</text><text class="lbl" x="548" y="250" text-anchor="start">delivery</text><path d="M620 310 L540 310 L540 650 L440 650" stroke="#8a9099" stroke-width="2.5" fill="none" marker-end="url(#ag)"/><text class="num" x="552" y="566" text-anchor="start">2</text><text class="lbl" x="552" y="588" text-anchor="start">GET</text><text class="lbl" x="552" y="610" text-anchor="start">/pulls/{n}</text><path d="M820 340 L820 420" stroke="#8a9099" stroke-width="2.5" fill="none" marker-end="url(#ag)"/><text class="num" x="834" y="386" text-anchor="start">3</text><text class="lbl" x="850" y="386" text-anchor="start">upsert row</text><path d="M1120 320 L1070 320 L1070 475 L1020 475" stroke="#8a9099" stroke-width="2.5" fill="none" marker-end="url(#ag)"/><text class="num" x="1080" y="372" text-anchor="start">4</text><text class="lbl" x="1096" y="372" text-anchor="start">read</text><text class="lbl" x="1080" y="394" text-anchor="start">ledger each cycle</text><path d="M1320 340 L1320 420" stroke="#8a9099" stroke-width="2.5" fill="none" marker-end="url(#ag)"/><text class="num" x="1334" y="386" text-anchor="start">5</text><text class="lbl" x="1350" y="386" text-anchor="start">if about to dispatch</text><path d="M1480 530 L1480 840 L260 840 L260 740" stroke="#9a3412" stroke-width="2.5" fill="none" marker-end="url(#ao)"/><text class="num" x="700" y="830" text-anchor="start">6</text><text class="lbl" x="716" y="830" text-anchor="start">search “Plan: &lt;id&gt;” — one call, ~50 ms; any hit = no spawn</text><path d="M1260 530 L1260 640" stroke="#9a3412" stroke-width="2.5" fill="none" marker-end="url(#ao)"/><text class="num" x="1274" y="596" text-anchor="start">7</text><text class="lbl" x="1290" y="596" text-anchor="start">none: spawn</text><path d="M620 700 L440 700" stroke="#8a9099" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#ag)"/><text class="lbl" x="452" y="690" text-anchor="start">list</text><path d="M820 640 L820 530" stroke="#8a9099" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#ag)"/><text class="lbl" x="834" y="596" text-anchor="start">repair</text><rect class="panel" x="40" y="920" width="760" height="166" rx="10" fill="#ffffff" stroke="#d0d5da" stroke-width="2"/><text class="lg" font-weight="700" x="58" y="950" text-anchor="start">Legend</text><rect x="58" y="963" width="34" height="20" rx="4" fill="#eef2fd" stroke="#1d4ed8" stroke-width="2"/><text class="lg" x="104" y="978" text-anchor="start">Forgejo on cihost</text><rect x="58" y="993" width="34" height="20" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text class="lg" x="104" y="1008" text-anchor="start">fleet process on opshost</text><rect x="58" y="1023" width="34" height="20" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text class="lg" x="104" y="1038" text-anchor="start">data in fleet.db</text><rect x="58" y="1053" width="34" height="20" rx="4" fill="#ffffff" stroke="#8a9099" stroke-width="2" stroke-dasharray="6 4"/><text class="lg" x="104" y="1068" text-anchor="start">dashed box = proposed, not built</text><rect class="panel" x="840" y="920" width="720" height="136" rx="10" fill="#ffffff" stroke="#d0d5da" stroke-width="2"/><text class="lg" font-weight="700" x="858" y="950" text-anchor="start">Legend</text><path class="legend-swatch" d="M858 972 L892 972" stroke="#8a9099" stroke-width="2.5"/><text class="lg" x="904" y="978" text-anchor="start">event or read path</text><path class="legend-swatch" d="M858 1002 L892 1002" stroke="#9a3412" stroke-width="2.5"/><text class="lg" x="904" y="1008" text-anchor="start">dispatch-safety path (search, then spawn)</text><path class="legend-swatch" d="M858 1032 L892 1032" stroke="#8a9099" stroke-width="2.5" stroke-dasharray="7 6"/><text class="lg" x="904" y="1038" text-anchor="start">backstop read (rare)</text></svg>
